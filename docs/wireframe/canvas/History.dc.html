<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
  <style>
/* 발표용 아트보드 공통 스타일 — 고딕(Noto Sans KR) · 본문 최소 20px
   플레이스홀더 두 자리(.input 안내 문구, .url 주소)만 예외로 작게 둔다. */
body{margin:0;font-family:'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif;color:#2b2b2b;background:#faf9f4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.board{width:1280px;height:760px;background:#faf9f4;padding:20px 32px;display:flex;flex-direction:column;gap:10px;position:relative}
.btitle{font-size:40px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.bsub{font-size:22px;font-weight:400;color:#8a8a83}
.row{display:flex;gap:36px;flex:1;align-items:flex-start;position:relative;min-height:0}

/* 브라우저 창 — 손그림 느낌(흔들린 모서리)은 그대로 둔다 */
.shell{background:#fff;border:3px solid #2b2b2b;border-radius:10px 8px 11px 9px;display:flex;flex-direction:column;overflow:hidden;box-shadow:4px 4px 0 rgba(43,43,43,.12)}
.shell.red{border-color:#d63030}
.shell.green{border-color:#1f8a4c}
.sbar{display:flex;align-items:center;gap:7px;padding:6px 11px;border-bottom:2.5px solid #2b2b2b;flex:none}
.sbar svg{flex:none}
.url{flex:1;border:2px solid #2b2b2b;border-radius:999px;padding:1px 11px;font-size:16px;color:#777;white-space:nowrap;overflow:hidden}
.inner{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1;overflow:hidden;min-height:0}

/* 글자 */
.h1{font-size:26px;font-weight:700;text-align:center}
.h2{font-size:23px;font-weight:700}
.h3{font-size:21px;font-weight:500;color:#6f6f68}
.input{border:2px solid #2b2b2b;border-radius:6px;padding:6px 10px;font-size:17px;color:#9a9a93;background:#fff}
.btn{border:2.5px solid #2b2b2b;border-radius:8px 6px 9px 7px;padding:5px 14px;font-size:20px;font-weight:500;background:#fff;text-align:center;width:max-content}
.btn.fill{background:#e9e7df}
.btn.wide{width:auto;align-self:stretch}
.pill{border:2px solid #2b2b2b;border-radius:999px;padding:2px 13px;font-size:20px;background:#fff}
.pill.on{background:#e9e7df}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{border:2px solid;border-radius:6px;padding:1px 9px;font-size:20px;font-weight:500;width:max-content}
.b-sale{color:#2b57b8}.b-free{color:#1f8a4c}.b-swap{color:#b8770b}
.b-state{color:#b8770b;border-style:dashed}
.b-done{color:#6f6f68;border-style:dashed}

/* 더미 텍스트 막대 — 글자가 아니므로 크기 규칙 대상이 아니다 */
.tl{height:4px;background:#b3b1a8;border-radius:3px}
.tls{display:flex;flex-direction:column;gap:7px}
.ph{background:linear-gradient(to top right,transparent calc(50% - 1.5px),#8f8d84 50%,transparent calc(50% + 1.5px)),linear-gradient(to bottom right,transparent calc(50% - 1.5px),#8f8d84 50%,transparent calc(50% + 1.5px)),#efede6;border:2px solid #8f8d84;border-radius:4px;flex:none}

/* 강조와 메모 */
.mark{outline:3px solid #d63030;outline-offset:4px;border-radius:4px}
.markg{outline:3px solid #1f8a4c;outline-offset:4px;border-radius:4px}
.lred{color:#d63030;font-size:21px;line-height:1.35}
.lgreen{color:#1f8a4c;font-size:21px;line-height:1.35}
.lgray{color:#8a8a83;font-size:21px;line-height:1.35}
.notes{display:flex;flex-direction:column;gap:15px;flex:1;padding-top:28px;min-width:236px}
.note{padding-left:15px;border-left:3px solid currentColor}
.legend{display:flex;gap:20px;align-items:center;font-size:20px;color:#6f6f68;margin-left:auto}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:0}
.i-red{background:#d63030}.i-green{background:#1f8a4c}

/* 채팅 */
/* 기본 프로필 아이콘 — 회원가입에서 사진을 받지 않으므로 모든 사용자가 같은 것을 쓴다 */
.avatar{width:30px;height:30px;border:2px solid #2b2b2b;border-radius:50%;flex:none;
        background:#cfe0ef url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='12.4'%20r='6.2'%20fill='%238ba9c6'/%3E%3Cpath%20d='M3.4%2032a12.6%2012.6%200%200%201%2025.2%200z'%20fill='%238ba9c6'/%3E%3C/svg%3E") center/100% 100% no-repeat}
.avatar.lg{width:44px;height:44px}
.bub{border:2px solid #2b2b2b;border-radius:10px;padding:7px 11px;background:#f3f1ea;flex:1;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;gap:9px;align-items:flex-start}

/* 카드 · 목록 */
.card{border:2px solid #2b2b2b;border-radius:8px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.cardpad{padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.peek{border-top:2px dashed #8f8d84;padding:4px 9px;font-size:20px;color:#1f8a4c;background:#eef5ee}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hrd{border:none;border-top:2px dashed #c9c7bd;margin:2px 0}

/* 내비게이션 */
.anav{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2.5px solid #2b2b2b;flex:none}
.brand{font-size:22px;font-weight:500}
.burger{width:38px;height:31px;border:2px solid #2b2b2b;border-radius:6px;display:flex;flex-direction:column;gap:4px;justify-content:center;align-items:center;flex:none}
.burger i{display:block;width:18px;height:2.5px;background:#2b2b2b}

/* 흐름 표시 */
.zl{position:absolute;background:#d63030;height:3px;z-index:5}
.arr{position:relative;width:70px;height:3px;background:#2b2b2b;flex:none;align-self:center}
.arr::after{content:"";position:absolute;right:-2px;top:-6px;border-left:12px solid #2b2b2b;border-top:7px solid transparent;border-bottom:7px solid transparent}
.flow{display:flex;flex-direction:column;align-items:center;gap:5px;align-self:center;flex:none;width:96px}
.flow .arr{width:80px}
.flow .cap{font-size:20px;color:#d63030;text-align:center;line-height:1.25}
.flow.g .arr{background:#1f8a4c}
.flow.g .arr::after{border-left-color:#1f8a4c}
.flow.g .cap{color:#1f8a4c}

/* 판매자 방 페이지네이션 */
.pager{display:flex;gap:7px;align-items:center;justify-content:center}
.pgn{border:2px solid #2b2b2b;border-radius:6px;min-width:34px;padding:2px 8px;font-size:20px;text-align:center;background:#fff}
.pgn.on{background:#2b2b2b;color:#fff}

/* 아키텍처 */
.archbox{border:3px solid #2b2b2b;border-radius:10px 8px 11px 9px;background:#fff;padding:12px 16px;display:flex;flex-direction:column;gap:7px;align-items:center}
.archlabel{font-size:21px;color:#8a8a83}
.band{border:3px solid #2b2b2b;border-radius:12px 9px 13px 10px;background:#fff;padding:12px 18px;display:flex;flex-direction:column;gap:9px}
.band.warm{background:#fdf3d7;border-color:#c9a13c}
.band.db{background:#eef2f8;border-color:#2b57b8}
.bandhead{font-size:24px;font-weight:700}
.bandsub{font-size:20px;color:#6f6f68}
.chipbox{border:2px solid #2b2b2b;border-radius:7px;padding:5px 11px;font-size:20px;background:#fff;text-align:center}
.chipbox .s{display:block;font-size:20px;color:#8a8a83}
.mono{font-family:'D2Coding','Noto Sans Mono CJK KR','Consolas',monospace;font-size:20px}

/* 3단 흐름 보드 — 메모를 아래 띠로 내려서 화면 폭을 확보한다 */
.flowrow{display:flex;gap:46px;flex:1;align-items:flex-start;position:relative;min-height:0}
.notesrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;flex:none;padding-top:2px}
.notesrow .note{padding-left:14px;border-left:3px solid currentColor;font-size:20px;line-height:1.35}
.zlab{position:absolute;font-size:20px;color:#d63030;text-align:center;line-height:1.2;z-index:6;background:#faf9f4;border-radius:4px;padding:1px 0}

/* 아키텍처 — 세로 밴드와 두 요청 경로 */
.varr{width:3px;background:#2b2b2b;position:relative;margin:0 auto}
.varr::after{content:"";position:absolute;bottom:-2px;left:-6px;border-top:12px solid #2b2b2b;border-left:7px solid transparent;border-right:7px solid transparent}
.varr.red{background:#d63030}.varr.red::after{border-top-color:#d63030}
.varr.green{background:#1f8a4c}.varr.green::after{border-top-color:#1f8a4c}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:44px;flex:none}
.path{display:flex;gap:14px;align-items:stretch}
.pathtx{flex:1;display:flex;flex-direction:column;gap:2px;justify-content:center}
.pathhead{font-size:21px;font-weight:700}
.pathhead.r{color:#d63030}.pathhead.g{color:#1f8a4c}
.deploy{display:flex;align-items:center;gap:12px;font-size:20px;color:#6f6f68;
        border-top:2px dashed #c9c7bd;padding-top:9px;flex:none}
.deploybox{border:2px solid #8a8a83;border-radius:7px;padding:2px 12px;font-size:20px;color:#2b2b2b;background:#fff}

/* 아키텍처 보드 — 요소가 적으므로 밴드를 넉넉하게 벌린다 */
.arch .band{padding:16px 20px;gap:12px}
.arch .bandhead{font-size:26px}
.arch .bandsub{font-size:21px}
.arch .chipbox{padding:9px 12px;font-size:21px}
.arch .paths{gap:44px}
.arch .pathtx{gap:3px}
.arch .pathhead{font-size:22px}
</style>
</helmet>

    <div style="display:flex;flex:1;min-height:0">
      <div style="width:62%;border-right:3px solid #2b2b2b;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fff">
        <div class="h2">메뉴</div>
        <div class="btn wide" style="display:flex;flex-direction:column;align-items:flex-start;gap:0"><span>Home</span><span style="font-size:20px;color:#8a8a83">거래 피드 · 물건 상세</span></div>
        <div class="btn wide" style="display:flex;flex-direction:column;align-items:flex-start;gap:0"><span>Community</span><span style="font-size:20px;color:#8a8a83">게시판 (P2)</span></div>
        <div class="btn wide" style="display:flex;flex-direction:column;align-items:flex-start;gap:0"><span>채팅목록</span><span style="font-size:20px;color:#8a8a83">진행 중인 1:1 방</span></div>
        <div class="btn wide mark" style="display:flex;flex-direction:column;align-items:flex-start;gap:0"><span>거래내역</span><span style="font-size:20px;color:#8a8a83">판매 · 구매</span></div>
        <div class="btn wide" style="display:flex;flex-direction:column;align-items:flex-start;gap:0"><span>로그아웃</span><span style="font-size:20px;color:#8a8a83">JWT 쿠키 삭제</span></div>
      </div>
      <div style="flex:1;background:#d9d7cf;opacity:.55;padding:10px"><div class="tls"><div class="tl" style="width:80%"></div><div class="tl" style="width:60%"></div><div class="tl" style="width:70%"></div><div class="tl" style="width:50%"></div><div class="tl" style="width:65%"></div></div></div>
    </div>
  </div>
  <div class="shell red" style="width:440px;height:520px"><div class="sbar"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L5 9 L12 15"></path></svg><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 L13 9 L6 15"></path></svg><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"><path d="M3 3 L13 13 M13 3 L3 13"></path></svg><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round"><path d="M2 9 L9 3 L16 9 M4 8 V15 H14 V8"></path></svg><div class="url">jungle-carrot.kr/history</div></div>
    <div class="inner">
      <div class="h2">거래내역</div>
      <div class="pills"><div class="pill on">판매</div><div class="pill">구매 <span style="color:#8a8a83">P1</span></div></div>
      <div style="display:flex;flex-direction:column;gap:11px">
      <div class="card">
        <div class="cardpad" style="flex-direction:row;align-items:center;gap:11px">
          <div class="ph" style="width:48px;height:42px"></div>
          <div class="tls" style="flex:1"><div class="tl" style="width:76%"></div><div class="tl" style="width:52%"></div></div>
          <div class="badge b-state">판매중</div>
        </div>
      </div>
      <div class="card">
        <div class="cardpad" style="flex-direction:row;align-items:center;gap:11px">
          <div class="ph" style="width:48px;height:42px"></div>
          <div class="tls" style="flex:1"><div class="tl" style="width:76%"></div><div class="tl" style="width:52%"></div></div>
          <div class="badge b-state">판매중</div>
        </div>
      </div>
      <div class="card" style="opacity:.6">
        <div class="cardpad" style="flex-direction:row;align-items:center;gap:11px">
          <div class="ph" style="width:48px;height:42px"></div>
          <div class="tls" style="flex:1"><div class="tl" style="width:76%"></div><div class="tl" style="width:52%"></div></div>
          <div class="badge b-done">판매완료</div>
        </div>
      </div>
      </div>
      <div class="lgray" style="font-size:20px">내가 올린 글을 상태별로 모아 본다. 뱃지는 items.status 하나를 읽는다</div>
    </div>
  </div>
</div>
