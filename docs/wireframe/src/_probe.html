<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#faf7f0}
#f{width:1000px;height:860px;border:0;display:block}</style>
<iframe id="f" src="../wireframe-v4-mvp.html"></iframe>
<script>
var f=document.getElementById('f');
f.onload=function(){
  var d=f.contentDocument;
  var st=d.createElement('style');
  st.textContent=".wrap{grid-template-columns:1fr !important;display:block !important;padding:0 !important}"
   +".sidepanel{display:none !important}.caption{display:none !important}"
   +".vwtoggle{display:none !important}";
  d.head.appendChild(st);
  var b=d.querySelector('[data-go=\"itemchat\"]'); if(b) b.click();
  document.title='ok';
};
</script>
