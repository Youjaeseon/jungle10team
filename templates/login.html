{% extends "base.html" %}
{% block title %}로그인 · 정글장터{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 400px;">
  <h1 class="h4 mb-3">로그인</h1>

  {# 서버가 아니라 자바스크립트가 채운다. 처음에는 d-none 으로 숨겨 둔다. #}
  <div class="alert alert-danger py-2 d-none" id="error"></div>

  <form id="login-form">
    <div class="mb-3">
      <label class="form-label" for="username">아이디</label>
      <input class="form-control" id="username" name="username" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">비밀번호</label>
      <input class="form-control" id="password" name="password" type="password" required>
    </div>

    <button class="btn btn-primary w-100" type="submit">로그인</button>
  </form>

  <p class="text-center mt-3 mb-0">
    아직 계정이 없나요? <a href="/signup">회원가입</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById("login-form");
const errorBox = document.getElementById("error");

form.addEventListener("submit", async (event) => {
  // 이걸 막지 않으면 브라우저가 원래 하던 폼 제출(페이지 이동)을 해 버린다.
  event.preventDefault();
  errorBox.classList.add("d-none");

  const response = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },   // 본문이 JSON 이라고 알린다
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value,
    }),
  });
  const data = await response.json();

  if (response.ok) {
    // 쿠키는 이 응답의 Set-Cookie 로 이미 브라우저에 심겼다. 화면만 옮기면 된다.
    location.href = data.redirect;
    return;
  }
  errorBox.textContent = "아이디 또는 비밀번호가 올바르지 않아요.";
  errorBox.classList.remove("d-none");
});
</script>
{% endblock %}
