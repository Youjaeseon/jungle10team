{% extends "base.html" %}
{% block title %}로그인 · 정글장터{% endblock %}

{% block styles %}
<style>
  body {
    background: #fbfdfb;
  }

  .login-page {
    display: grid;
    min-height: calc(100vh - 2rem);
    place-items: center;
    padding: 2.5rem 1rem;
  }

  .login-card {
    width: min(520px, 100%);
    padding: 3.5rem 3.25rem 2.75rem;
    border: 1px solid #d9e8de;
    border-radius: 28px;
    background: #ffffff;
    box-shadow: 0 22px 60px rgba(18, 55, 42, 0.08);
  }

  .login-brand {
    margin-bottom: 2.5rem;
    text-align: center;
  }

  .login-brand-mark {
    width: 62px;
    height: 62px;
    margin-bottom: 0.6rem;
    object-fit: contain;
  }

  .login-brand h1 {
    margin-bottom: 0.5rem;
    color: #12372a;
    font-size: clamp(2.25rem, 6vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.06em;
  }

  .login-brand p {
    margin: 0;
    color: #737d83;
    font-size: 1.05rem;
  }

  .login-card .form-label {
    margin-bottom: 0.65rem;
    color: #173b2e;
    font-size: 1.05rem;
    font-weight: 700;
  }

  .login-card .form-control {
    min-height: 58px;
    border: 1px solid #d9dee2;
    border-radius: 12px;
    background-color: #ffffff;
    font-size: 1rem;
  }

  .login-card .form-control:focus {
    border-color: #237a4d;
    box-shadow: 0 0 0 0.22rem rgba(35, 122, 77, 0.13);
  }

  .login-button {
    min-height: 58px;
    border: 0;
    border-radius: 12px;
    background-color: #103d2e;
    color: #ffffff;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .login-button:hover,
  .login-button:focus {
    background-color: #176b3a;
    color: #ffffff;
  }

  .login-signup {
    margin: 2rem 0 0;
    color: #294137;
    text-align: center;
  }

  .login-signup a {
    color: #176b3a;
    font-weight: 700;
    text-underline-offset: 3px;
  }

  @media (max-width: 575.98px) {
    .login-page {
      padding: 1rem 0;
    }

    .login-card {
      padding: 2.5rem 1.5rem 2rem;
      border-radius: 22px;
      box-shadow: 0 14px 36px rgba(18, 55, 42, 0.07);
    }
  }
</style>
{% endblock %}

    <div class="alert alert-danger py-2 d-none" id="error" role="alert"></div>

    <form id="login-form">
      <div class="mb-4">
        <label class="form-label" for="username">아이디</label>
        <input
          class="form-control"
          id="username"
          name="username"
          autocomplete="username"
          required
        >
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">비밀번호</label>
        <input
          class="form-control"
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="login-button w-100" type="submit">로그인</button>
    </form>

    <p class="login-signup">
      처음 오셨나요? <a href="/signup">회원가입</a>
    </p>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("error");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.classList.add("d-none");

    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    const data = await response.json();

    if (response.ok) {
      location.href = data.redirect;
      return;
    }

    errorBox.textContent = "아이디 또는 비밀번호가 올바르지 않아요.";
    errorBox.classList.remove("d-none");
  });
</script>
{% endblock %}
